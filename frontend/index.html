<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Felipe Bell Marques — Full Stack Developer" />
    <meta name="theme-color" content="#111111" />
    <title>Portfolio — Felipe Bell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;800&display=swap" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint — avoids a dark→light flash. See useTheme.js.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        // Browser chrome colour = the wall (DESIGN.md `base` / `base-light`); useTheme.js keeps it in sync afterwards.
        document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#EDEDED" : "#111111";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"> </script>
  </body>
</html>
